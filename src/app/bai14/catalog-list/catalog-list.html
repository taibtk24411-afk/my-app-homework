<ng-container *ngFor="let cate of categories; let i = index">
  <table border="1">
    <tr *ngIf="i === 0">
      <td>Ma Danh Muc</td>
      <td>Ten Danh Muc</td>
    </tr>
    <tr>
      <td>{{cate.Cateid}}</td>
      <td>{{cate.CateName}}</td>
    </tr>
  </table>

  <table border="1">
    <tr>
      <td>Ma San Pham</td>
      <td>Ten San Pham</td>
      <td>Gia San Pham</td>
      <td>Picture</td>
    </tr>
    <tbody *ngFor="let p of cate.Products">
      <tr>
        <td>{{p.ProductId}}</td>
        <td>{{p.ProductName}}</td>
        <td>{{p.Price}}</td>
        <td><img src="{{p.Image}}"></td>
      </tr>
    </tbody>
  </table>
</ng-container>
